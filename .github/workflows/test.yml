name: Test

on:
  push:
    branches-ignore:
      - main  # main は deploy.yml が実行する
  pull_request:
    branches:
      - next
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.php == '8.3' && matrix.db == 'sqlite' && 'PHPUnit Tests' || format('PHPUnit Tests ({0}, PHP {1})', matrix.db, matrix.php) }}

    # Every PHP version from core's floor (^8.3) up (Dixlase/dixlase-core#977).
    # 8.6 is a development build in setup-php (8.6.0-dev) until it is
    # released, so its legs report but do not fail the workflow; move it
    # into `php` once setup-php lists it as stable. The 8.3 leg keeps the
    # check name the rulesets require, so the extra versions add checks
    # without renaming that one.
    #
    # SQLite accepts values MariaDB refuses (an empty string in an integer
    # or datetime column, for one), so the suite also runs on the database
    # the Docker installer ships (Dixlase/dixlase-core#978). The service
    # container exists for every leg; the SQLite legs ignore it.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb]
        php: ['8.3', '8.4', '8.5']
        experimental: [false]
        include:
          - db: sqlite
            php: '8.6'
            experimental: true
          - db: mariadb
            php: '8.6'
            experimental: true

    services:
      mariadb:
        image: mariadb:12.2.2
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: dixlase_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      # Verify the frontend build stays green on every PR / non-main push
      # so build breakage is caught before it reaches main (where deploy.yml
      # would then ship a broken artifact). Guarded on `package.json` so the
      # step remains a clean no-op for plugins that do not carry a Node
      # build yet.
      - name: Setup Node.js (for frontend build verification)
        if: hashFiles('plugin/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify frontend build
        if: hashFiles('plugin/package.json') != ''
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, pdo_mysql, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core no longer tracks plugins/ (it is gitignored), so a fresh
          # core checkout has no plugins/ directory. Create it before moving
          # the plugin in, otherwise `mv` fails with "No such file or directory".
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseMenus
          mv plugin core/plugins/DixlaseMenus

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # composer.local.json を生成（プラグインの psr-4 マッピングを集約）
          # 通常は pre-autoload-dump フックで実行されるが --no-scripts のため明示実行
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize
          # bootstrap/cache/{packages,services}.php を事前生成する。
          # `--no-scripts` により post-autoload-dump がスキップされるため、
          # phpunit の最初のテスト boot 時に PackageManifest::build() が lazy
          # に走り、そのプロセス内の最初のリクエストで session errors が
          # flash されない first-boot flake を踏むことがある
          # （MenuSlugUniquenessTest::test_store_fails_when_slug_already_exists
          # がこれで落ちていた）。ここで明示的に warm しておく。
          php artisan package:discover --ansi

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests (SQLite)
        if: matrix.db == 'sqlite'
        working-directory: core/plugins/DixlaseMenus
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit

      - name: Run PHPUnit tests (MariaDB)
        if: matrix.db == 'mariadb'
        working-directory: core/plugins/DixlaseMenus
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
          # phpunit.xml's <env> entries are not forced, so these win. Core's
          # TestCase refuses MySQL drivers unless told the database is a
          # disposable one -- which the service container above is.
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dixlase_test
          DB_USERNAME: root
          DB_PASSWORD: password
          DLS_TESTS_ALLOW_NON_SQLITE: '1'
        # phpunit.xml forces DB_CONNECTION=sqlite and DB_DATABASE=:memory:
        # (force="true", a guard for local runs), which would override the
        # values above. Run from a CI-only copy without those two lines, and
        # stop if they are still there.
        run: |
          grep -vE '<env name="DB_(CONNECTION|DATABASE)"' phpunit.xml > phpunit.mariadb.xml
          if grep -qE '<env name="DB_(CONNECTION|DATABASE)"' phpunit.mariadb.xml; then
            echo "::error::phpunit.mariadb.xml still pins the database" && exit 1
          fi
          ../../vendor/bin/phpunit -c phpunit.mariadb.xml

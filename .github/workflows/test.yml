name: Test

on:
  push:
    branches-ignore:
      - main  # main は deploy.yml が実行する
  pull_request:
    branches:
      - main

# GitHub OAuth token for composer to clone the private
# `dixlase/dixlase-onepage` dependency referenced by Core's
# composer.json. The PAT lives in the organization secret
# `COMPOSER_AUTH` with Contents:Read scoped to that repo only.
env:
  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHPUnit Tests

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      # Verify the frontend build stays green on every PR / non-main push
      # so build breakage is caught before it reaches main (where deploy.yml
      # would then ship a broken artifact). Guarded on `package.json` so the
      # step remains a clean no-op for plugins that do not carry a Node
      # build yet.
      - name: Setup Node.js (for frontend build verification)
        if: hashFiles('plugin/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Verify frontend build
        if: hashFiles('plugin/package.json') != ''
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Checkout core
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: core

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, json, sqlite3, pdo_sqlite, gd
          coverage: none

      - name: Place plugin into core directory
        run: |
          # Core no longer tracks plugins/ (it is gitignored), so a fresh
          # core checkout has no plugins/ directory. Create it before moving
          # the plugin in, otherwise `mv` fails with "No such file or directory".
          mkdir -p core/plugins
          rm -rf core/plugins/DixlaseMenus
          mv plugin core/plugins/DixlaseMenus

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: core/vendor
          key: ${{ runner.os }}-php83-composer-${{ hashFiles('core/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php83-composer-

      - name: Install core composer dependencies
        working-directory: core
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Sync plugin autoload mappings
        working-directory: core
        run: |
          # composer.local.json を生成（プラグインの psr-4 マッピングを集約）
          # 通常は pre-autoload-dump フックで実行されるが --no-scripts のため明示実行
          php scripts/sync-local-autoload.php
          composer dump-autoload --no-scripts --optimize
          # bootstrap/cache/{packages,services}.php を事前生成する。
          # `--no-scripts` により post-autoload-dump がスキップされるため、
          # phpunit の最初のテスト boot 時に PackageManifest::build() が lazy
          # に走り、そのプロセス内の最初のリクエストで session errors が
          # flash されない first-boot flake を踏むことがある
          # （MenuSlugUniquenessTest::test_store_fails_when_slug_already_exists
          # がこれで落ちていた）。ここで明示的に warm しておく。
          php artisan package:discover --ansi

      - name: Setup test environment
        working-directory: core
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=${APP_KEY}" >> .env

      - name: Run PHPUnit tests
        working-directory: core/plugins/DixlaseMenus
        env:
          APP_KEY: base64:INAsYduzvVFuYXTFeMS0EkLXHynFalWYt/O9hUlTdfg=
        run: ../../vendor/bin/phpunit
